<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prospection GoLead</title>
  <meta name="description" content="Suivi de prospection WhatsApp : contacts, relances, clients et bilan.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#104B5B">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span id="topTitle">Prospection</span>
    </div>
    <button id="syncBtn" class="sync" type="button" aria-live="polite">…</button>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.4h-4L10.6 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1">
    <noscript><p class="card">Cette application a besoin de JavaScript.</p></noscript>
    <p class="loading">Chargement…</p>
  </main>

  <nav class="tabs" aria-label="Navigation principale">
    <button data-act="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm-2 8h14v10H5V10Zm2 3v2h4v-2H7Z"/></svg><span>Aujourd'hui</span></button>
    <button data-act="tab" data-tab="saisir" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg><span>Saisir</span><b class="badge" id="badgeSaisir" hidden></b></button>
    <button data-act="tab" data-tab="suivi" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"/></svg><span>Suivi</span></button>
    <button data-act="tab" data-tab="clients" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg><span>Clients</span><b class="badge alt" id="badgeClients" hidden></b></button>
    <button data-act="tab" data-tab="bilan" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10h3v9H5Zm5.5 0V5h3v14h-3ZM16 19v-6h3v6h-3Z"/></svg><span>Bilan</span></button>
  </nav>

  <div id="overlays"></div>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
